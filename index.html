{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3 class="mb-0">Products</h3>
  <form class="d-flex" method="get" action="{{ url_for('index') }}">
    <input name="q" class="form-control me-2" type="search" placeholder="Search phones, laptops, ..." value="{{ q or '' }}">
    <button class="btn btn-outline-secondary" type="submit">Search</button>
  </form>
</div>

{% if products %}
<div class="row g-3">
  {% for p in products %}
  <div class="col-12 col-sm-6 col-md-4">
    <div class="card h-100 shadow-sm">
      <img src="{{ p.image_url or 'https://via.placeholder.com/400x260?text=Product' }}" class="card-img-top" alt="{{ p.name }}">
      <div class="card-body d-flex flex-column">
        <h6 class="card-title">{{ p.name }}</h6>
        <p class="text-muted small flex-grow-1">{{ p.description or '' }}</p>
        <div class="d-flex align-items-center justify-content-between">
          <div class="price">₹ {{ '%.2f'|format(p.price) }}</div>
          <form method="post" action="{{ url_for('cart_add', product_id=p.id) }}" class="d-flex">
            <input type="number" name="quantity" class="form-control form-control-sm me-2" value="1" min="1" style="width:80px;">
            <button class="btn btn-dark btn-sm" type="submit">Add to cart</button>
          </form>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="text-center py-5">
  <p class="text-muted mb-2">No products found for your search.</p>
  <a class="btn btn-outline-secondary" href="{{ url_for('index') }}">Clear search</a>
</div>
{% endif %}
{% endblock %}
